name: RZ MINETRIX CI & Audit

on:
  push:
    branches:
      - main
      - "feat/**"
      - "automation/**"
  pull_request:
    branches:
      - main
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install

      - name: TypeScript check
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Run tests when a test script exists
        shell: bash
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.test ? 0 : 1)"; then
            bun run test
          else
            echo "::warning::No test script is defined in package.json; automated tests were not run."
          fi

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rz-minetrix-build
          path: dist/
          if-no-files-found: warn
          retention-days: 7
