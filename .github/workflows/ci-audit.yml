name: RZ MINETRIX CI & Audit

on:
  push:
    branches:
      - main
      - "feat/**"
      - "automation/**"
  pull_request:
    branches:
      - main
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Build production container with non-secret placeholder Firebase config
        run: |
          docker build \
            --build-arg VITE_FIREBASE_API_KEY=test-api-key \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN=example.firebaseapp.com \
            --build-arg VITE_FIREBASE_PROJECT_ID=test-project \
            --build-arg VITE_FIREBASE_STORAGE_BUCKET=test-project.appspot.com \
            --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID=000000000000 \
            --build-arg VITE_FIREBASE_APP_ID=1:000000000000:web:test \
            -t rz-minetrix-erp:ci .

      - name: Run tests when a test script exists
        shell: bash
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.test ? 0 : 1)"; then
            npm run test
          else
            echo "::warning::No test script is defined in package.json; automated tests were not run."
          fi

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rz-minetrix-build
          path: dist/
          if-no-files-found: warn
          retention-days: 7
