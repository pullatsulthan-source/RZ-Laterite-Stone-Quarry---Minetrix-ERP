name: Production Gate

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ''

      - name: Validate package manifest
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json valid')"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-online

      - name: TypeScript / lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Docker build
        run: docker build --tag rz-minetrix-erp:${{ github.sha }} .
