name: Stage 1 Reverification

on:
  push:
    branches: ['fix/stage1-ci-production-gate']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Stage 1 full verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ''
      - name: Validate package manifest
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json valid')"
      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-online
      - name: Typecheck / lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Docker build
        run: docker build --tag rz-minetrix-erp:${{ github.sha }} .
