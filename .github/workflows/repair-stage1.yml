name: Repair Stage 1

on:
  push:
    branches:
      - fix/stage1-ci-production-gate

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'ci: repair Stage 1 syntax'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair generated syntax corruption
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          drizzle = Path('drizzle.config.ts')
          drizzle.write_text("""import 'dotenv/config';
          import { defineConfig } from 'drizzle-kit';

          export default defineConfig({
            schema: './src/db/schema.ts',
            out: './src/db/migrations',
            dialect: 'postgresql',
            dbCredentials: {
              url: process.env.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/rz_minetrix',
            },
            verbose: true,
            strict: true,
          });
          """.lstrip())

          p = Path('server.ts')
          s = p.read_text()
          start = s.find('// Return only the server-verified identity and effective permissions.')
          end = s.find('// Fail closed: all ERP APIs require a verified Firebase ID token.')
          if start == -1 or end == -1 or end <= start:
              raise SystemExit('Could not locate corrupted auth/session block')

          replacement = """// Return only the server-verified identity and effective permissions.
          // Firebase client sign-in alone does not grant ERP access.
          app.get('/api/auth/session', (req: Request, res: Response) => {
            const user = req.user;
            if (!user) return res.status(401).json({ error: 'Authentication required' });
            return res.json({
              authenticated: true,
              user: {
                uid: user.uid,
                email: user.email,
                name: user.name,
                picture: user.picture || null,
                role: user.role,
                quarryIds: user.quarryIds,
              },
            });
          });

          // Production PostgreSQL + Drizzle Database Status Endpoint
          app.get('/api/db/status', async (req: Request, res: Response) => {
            const configured = isDatabaseConfigured();
            if (!configured) {
              return res.json({
                engine: 'PostgreSQL + Drizzle ORM',
                configured: false,
                status: 'FALLBACK_FILE_DB',
                message: 'DATABASE_URL is not set; running on persistent fallback data file.',
              });
            }
            try {
              const result = await pool.query(
                \"SELECT NOW() as current_time, count(*) as tables_count FROM information_schema.tables WHERE table_schema = 'public'\"
              );
              return res.json({
                engine: 'PostgreSQL + Drizzle ORM',
                configured: true,
                status: 'CONNECTED',
                currentTime: result.rows[0]?.current_time,
                tablesCount: Number(result.rows[0]?.tables_count || 0),
              });
            } catch (err: any) {
              return res.status(503).json({
                engine: 'PostgreSQL + Drizzle ORM',
                configured: true,
                status: 'DISCONNECTED',
                error: process.env.NODE_ENV === 'production' ? 'Database unavailable' : err.message,
              });
            }
          });

          """
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY

      - name: Verify repaired files
        run: |
          node --check server.ts || true
          npx tsc --noEmit

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add drizzle.config.ts server.ts
          git diff --cached --quiet && exit 0
          git commit -m 'ci: repair Stage 1 syntax'
          git push
